<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444" />
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2ea44f" />
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Recommended Fix: DestinationRule TLS Origination (mode: SIMPLE)</text>

  <!-- Client -->
  <rect x="20" y="110" width="120" height="70" rx="8" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="80" y="140" text-anchor="middle" font-size="13" fill="#1a3d7c">curl client</text>
  <text x="80" y="158" text-anchor="middle" font-size="10.5" fill="#1a3d7c">http://...:30000</text>

  <!-- Gateway -->
  <rect x="210" y="90" width="170" height="110" rx="8" fill="#eafff1" stroke="#2ea44f" stroke-width="2"/>
  <text x="295" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">Ingress Gateway</text>
  <text x="295" y="131" text-anchor="middle" font-size="10.5" fill="#155724">protocol: HTTP</text>
  <text x="295" y="147" text-anchor="middle" font-size="10.5" fill="#155724">port 80 -&gt; 30000</text>
  <text x="295" y="163" text-anchor="middle" font-size="10.5" fill="#155724">(unchanged)</text>

  <!-- VS -->
  <rect x="430" y="90" width="170" height="110" rx="8" fill="#eafff1" stroke="#2ea44f" stroke-width="2"/>
  <text x="515" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">VirtualService</text>
  <text x="515" y="131" text-anchor="middle" font-size="10.5" fill="#155724">route -&gt; booking-service:443</text>
  <text x="515" y="147" text-anchor="middle" font-size="10.5" fill="#155724">(unchanged)</text>

  <!-- DestinationRule (NEW) -->
  <rect x="640" y="70" width="140" height="60" rx="8" fill="#fff7e6" stroke="#d19a15" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="710" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5b00">DestinationRule</text>
  <text x="710" y="108" text-anchor="middle" font-size="10" fill="#7a5b00">tls.mode: SIMPLE</text>
  <text x="710" y="122" text-anchor="middle" font-size="9.5" fill="#7a5b00" font-weight="bold">★ NEW resource</text>

  <!-- Backend -->
  <rect x="700" y="150" width="180" height="90" rx="8" fill="#eafff1" stroke="#2ea44f" stroke-width="2"/>
  <text x="790" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">booking-service</text>
  <text x="790" y="193" text-anchor="middle" font-size="10.5" fill="#155724">:443 (TLS terminated</text>
  <text x="790" y="209" text-anchor="middle" font-size="10.5" fill="#155724">by app, unchanged)</text>

  <!-- arrows -->
  <line x1="140" y1="145" x2="205" y2="145" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="145" x2="425" y2="145" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="600" y1="145" x2="700" y2="180" stroke="#2ea44f" stroke-width="2.5" marker-end="url(#arg)"/>
  <text x="660" y="165" text-anchor="middle" font-size="10" fill="#2ea44f" font-weight="bold">Envoy wraps in TLS</text>
  <text x="660" y="178" text-anchor="middle" font-size="10" fill="#2ea44f" font-weight="bold">before forwarding</text>

  <line x1="710" y1="130" x2="710" y2="150" stroke="#d19a15" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4,2"/>
  <text x="740" y="145" font-size="9.5" fill="#7a5b00">applies to</text>

  <!-- caption -->
  <rect x="20" y="250" width="860" height="40" rx="6" fill="#f6f6f6" stroke="#ccc"/>
  <text x="35" y="274" font-size="11.5" fill="#333">Only one new object is added (DestinationRule). Gateway and VirtualService stay exactly as they were — lowest-risk, fastest fix.</text>
</svg>
