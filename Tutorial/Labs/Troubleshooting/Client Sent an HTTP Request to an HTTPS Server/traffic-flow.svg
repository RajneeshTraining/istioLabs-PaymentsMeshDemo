<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Request Path: curl -&gt; Istio Ingress -&gt; booking-service</text>

  <!-- Client -->
  <rect x="20" y="160" width="120" height="70" rx="8" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="80" y="190" text-anchor="middle" font-size="14" fill="#1a3d7c">curl client</text>
  <text x="80" y="208" text-anchor="middle" font-size="11" fill="#1a3d7c">http://...:30000</text>

  <!-- Ingress Gateway -->
  <rect x="220" y="140" width="180" height="110" rx="8" fill="#eafff1" stroke="#2ea44f" stroke-width="2"/>
  <text x="310" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#155724">istio-ingressgateway</text>
  <text x="310" y="185" text-anchor="middle" font-size="11" fill="#155724">Service: NodePort</text>
  <text x="310" y="202" text-anchor="middle" font-size="11" fill="#155724">80 -&gt; 30000 (HTTP)</text>
  <text x="310" y="219" text-anchor="middle" font-size="11" fill="#155724">443 -&gt; 30443 (HTTPS)</text>
  <text x="310" y="236" text-anchor="middle" font-size="10" fill="#155724">Gateway: booking-gateway</text>

  <!-- VirtualService box -->
  <rect x="450" y="140" width="180" height="110" rx="8" fill="#fff7e6" stroke="#d19a15" stroke-width="2"/>
  <text x="540" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5b00">VirtualService</text>
  <text x="540" y="185" text-anchor="middle" font-size="11" fill="#7a5b00">host: booking.example.com</text>
  <text x="540" y="202" text-anchor="middle" font-size="11" fill="#7a5b00">route -&gt; booking-service</text>
  <text x="540" y="219" text-anchor="middle" font-size="11" fill="#7a5b00">port: 443</text>
  <text x="540" y="236" text-anchor="middle" font-size="10" fill="#7a5b00">(plaintext HTTP forwarded)</text>

  <!-- Backend pod -->
  <rect x="700" y="140" width="180" height="110" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c1a1a">booking-service</text>
  <text x="790" y="185" text-anchor="middle" font-size="11" fill="#7c1a1a">ClusterIP :443</text>
  <text x="790" y="202" text-anchor="middle" font-size="11" fill="#7c1a1a">Pod expects TLS</text>
  <text x="790" y="219" text-anchor="middle" font-size="11" fill="#7c1a1a">on port 443</text>
  <text x="790" y="236" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Receives plaintext!</text>

  <!-- Arrows -->
  <line x1="140" y1="195" x2="215" y2="195" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="177" y="185" text-anchor="middle" font-size="10" fill="#444">1</text>

  <line x1="400" y1="195" x2="445" y2="195" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="185" text-anchor="middle" font-size="10" fill="#444">2</text>

  <line x1="630" y1="195" x2="695" y2="195" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="662" y="180" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">3 (plain HTTP)</text>

  <!-- Bottom notes -->
  <rect x="20" y="300" width="860" height="90" rx="8" fill="#f6f6f6" stroke="#ccc"/>
  <text x="35" y="322" font-size="12" fill="#333" font-weight="bold">Where it breaks:</text>
  <text x="35" y="342" font-size="11.5" fill="#333">Step 1-2 succeed: Gateway "booking-gateway" is correctly configured as protocol: HTTP on port 80, so the ingress accepts the plaintext request fine.</text>
  <text x="35" y="360" font-size="11.5" fill="#333">Step 3 fails: the VirtualService routes to booking-service:443 without TLS origination. The backend Service only exposes 443/TCP</text>
  <text x="35" y="378" font-size="11.5" fill="#333">and the pod behind it expects a TLS handshake there, so it rejects the plaintext request with "Client sent an HTTP request to an HTTPS server."</text>
</svg>
