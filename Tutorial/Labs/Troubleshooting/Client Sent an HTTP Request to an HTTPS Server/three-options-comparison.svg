<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Three Ways to Fix: Plaintext Forwarded to a TLS-Expecting Backend</text>

  <!-- Root node -->
  <rect x="370" y="50" width="260" height="55" rx="8" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="500" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3d7c">booking-service expects TLS</text>
  <text x="500" y="90" text-anchor="middle" font-size="11" fill="#1a3d7c">only port 443, no plaintext option</text>

  <line x1="500" y1="105" x2="500" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="130" x2="160" y2="160" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="130" x2="500" y2="160" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="130" x2="840" y2="160" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- Option: PASSTHROUGH (exam best) -->
  <rect x="20" y="160" width="290" height="190" rx="10" fill="#eafff1" stroke="#2ea44f" stroke-width="3"/>
  <text x="165" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#155724">★ BEST FOR THE ICA EXAM</text>
  <text x="165" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#155724">Gateway TLS: PASSTHROUGH</text>
  <text x="165" y="222" text-anchor="middle" font-size="11" fill="#155724">+ VS tls: block, sniHosts match</text>
  <line x1="35" y1="232" x2="295" y2="232" stroke="#2ea44f" stroke-width="1"/>
  <text x="35" y="250" font-size="10.5" fill="#155724">+ Matches documented pattern for a</text>
  <text x="35" y="264" font-size="10.5" fill="#155724">  backend that already owns its own cert</text>
  <text x="35" y="282" font-size="10.5" fill="#155724">+ Named Gateway TLS mode — directly</text>
  <text x="35" y="296" font-size="10.5" fill="#155724">  tests the 40%-weighted Traffic Mgmt domain</text>
  <text x="35" y="314" font-size="10.5" fill="#155724">- Client must use https:// + SNI</text>
  <text x="35" y="328" font-size="10.5" fill="#155724">- Loses HTTP-layer (path) routing</text>
  <text x="35" y="344" font-size="10.5" fill="#155724" font-weight="bold">Use when: 443-only backend, no plaintext port</text>

  <!-- Option: DestinationRule (production pragmatic) -->
  <rect x="350" y="160" width="300" height="190" rx="10" fill="#fff7e6" stroke="#d19a15" stroke-width="2"/>
  <text x="500" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5b00">BEST FOR LIVE PRODUCTION</text>
  <text x="500" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5b00">DestinationRule</text>
  <text x="500" y="222" text-anchor="middle" font-size="11" fill="#7a5b00">tls.mode: SIMPLE</text>
  <line x1="365" y1="232" x2="635" y2="232" stroke="#d19a15" stroke-width="1"/>
  <text x="365" y="250" font-size="10.5" fill="#7a5b00">+ Add ONE new resource</text>
  <text x="365" y="264" font-size="10.5" fill="#7a5b00">+ Gateway/VS/app all stay unchanged</text>
  <text x="365" y="282" font-size="10.5" fill="#7a5b00">+ Keeps L7 (path/header) routing</text>
  <text x="365" y="296" font-size="10.5" fill="#7a5b00">+ No client-facing URL/SNI change</text>
  <text x="365" y="314" font-size="10.5" fill="#7a5b00">- Less likely to be the "expected"</text>
  <text x="365" y="328" font-size="10.5" fill="#7a5b00">  scenario-question answer</text>
  <text x="365" y="344" font-size="10.5" fill="#7a5b00" font-weight="bold">Use when: fastest, lowest-risk live patch</text>

  <!-- Option: Re-architect -->
  <rect x="690" y="160" width="290" height="190" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="835" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c1a1a">LONG-TERM REDESIGN</text>
  <text x="835" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c1a1a">Backend -&gt; plain HTTP</text>
  <text x="835" y="222" text-anchor="middle" font-size="11" fill="#7c1a1a">+ mesh mTLS (ISTIO_MUTUAL)</text>
  <line x1="705" y1="232" x2="965" y2="232" stroke="#c0392b" stroke-width="1"/>
  <text x="705" y="250" font-size="10.5" fill="#7c1a1a">+ App / container change required</text>
  <text x="705" y="264" font-size="10.5" fill="#7c1a1a">+ Service + VS port updated</text>
  <text x="705" y="282" font-size="10.5" fill="#7c1a1a">+ Most mesh-native long-term design</text>
  <text x="705" y="296" font-size="10.5" fill="#7c1a1a">+ Keeps L7 routing</text>
  <text x="705" y="314" font-size="10.5" fill="#7c1a1a">- Out of scope for a pure</text>
  <text x="705" y="328" font-size="10.5" fill="#7c1a1a">  Istio-config exam question</text>
  <text x="705" y="344" font-size="10.5" fill="#7c1a1a" font-weight="bold">Use when: redesigning the service itself</text>

  <!-- Bottom summary -->
  <rect x="20" y="380" width="960" height="150" rx="8" fill="#f6f6f6" stroke="#ccc"/>
  <text x="35" y="404" font-size="13" font-weight="bold" fill="#333">Exam framing:</text>
  <text x="35" y="426" font-size="11.5" fill="#333">The backend exposing ONLY port 443 -- with no plaintext port at all -- is the classic signal Istio's own docs use to teach TLS</text>
  <text x="35" y="444" font-size="11.5" fill="#333">PASSTHROUGH: a workload that already owns and terminates its own certificate. Traffic Management is the largest ICA domain (40%)</text>
  <text x="35" y="462" font-size="11.5" fill="#333">and explicitly names Gateway TLS modes (SIMPLE / MUTUAL / PASSTHROUGH / AUTO_PASSTHROUGH) as tested material, so a scenario</text>
  <text x="35" y="480" font-size="11.5" fill="#333">built around a 443-only backend is most likely testing recognition of PASSTHROUGH -- not a DestinationRule you'd need to infer.</text>
  <text x="35" y="500" font-size="11.5" fill="#333">Reserve DestinationRule SIMPLE for real incidents where you can't touch the Gateway/VS, and the backend redesign for refactors.</text>
</svg>
