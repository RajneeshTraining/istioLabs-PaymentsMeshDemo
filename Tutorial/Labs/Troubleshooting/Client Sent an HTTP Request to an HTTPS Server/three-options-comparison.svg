<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Three Ways to Fix: Plaintext Forwarded to a TLS-Expecting Backend</text>

  <!-- Root node -->
  <rect x="370" y="50" width="260" height="55" rx="8" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="500" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3d7c">booking-service expects TLS</text>
  <text x="500" y="90" text-anchor="middle" font-size="11" fill="#1a3d7c">on port 443, VS forwards plaintext</text>

  <line x1="500" y1="105" x2="500" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- three branches -->
  <line x1="500" y1="130" x2="160" y2="160" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="130" x2="500" y2="160" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="130" x2="840" y2="160" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- Option B (BEST / fastest) -->
  <rect x="20" y="160" width="290" height="170" rx="10" fill="#eafff1" stroke="#2ea44f" stroke-width="3"/>
  <text x="165" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#155724">★ BEST / FASTEST FIX</text>
  <text x="165" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#155724">DestinationRule</text>
  <text x="165" y="222" text-anchor="middle" font-size="11" fill="#155724">tls.mode: SIMPLE</text>
  <line x1="35" y1="232" x2="295" y2="232" stroke="#2ea44f" stroke-width="1"/>
  <text x="35" y="250" font-size="10.5" fill="#155724">+ Add ONE new resource</text>
  <text x="35" y="266" font-size="10.5" fill="#155724">+ No Gateway/VS/app changes</text>
  <text x="35" y="282" font-size="10.5" fill="#155724">+ Keeps L7 (path/header) routing</text>
  <text x="35" y="298" font-size="10.5" fill="#155724">+ Smallest blast radius</text>
  <text x="35" y="314" font-size="10.5" fill="#155724" font-weight="bold">Use when: quick, low-risk fix needed</text>

  <!-- Option A (long term) -->
  <rect x="350" y="160" width="300" height="170" rx="10" fill="#fff7e6" stroke="#d19a15" stroke-width="2"/>
  <text x="500" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5b00">ALTERNATE: Re-architect</text>
  <text x="500" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5b00">Backend -&gt; plain HTTP</text>
  <text x="500" y="222" text-anchor="middle" font-size="11" fill="#7a5b00">+ mesh-managed mTLS (ISTIO_MUTUAL)</text>
  <line x1="365" y1="232" x2="635" y2="232" stroke="#d19a15" stroke-width="1"/>
  <text x="365" y="250" font-size="10.5" fill="#7a5b00">+ App code / container change required</text>
  <text x="365" y="266" font-size="10.5" fill="#7a5b00">+ Service + VS port updated</text>
  <text x="365" y="282" font-size="10.5" fill="#7a5b00">+ Best long-term mesh-native design</text>
  <text x="365" y="298" font-size="10.5" fill="#7a5b00">+ More moving parts to change</text>
  <text x="365" y="314" font-size="10.5" fill="#7a5b00" font-weight="bold">Use when: redesigning the service</text>

  <!-- Option C (passthrough) -->
  <rect x="690" y="160" width="290" height="170" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="835" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c1a1a">ALTERNATE: End-to-end TLS</text>
  <text x="835" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c1a1a">Gateway TLS PASSTHROUGH</text>
  <text x="835" y="222" text-anchor="middle" font-size="11" fill="#7c1a1a">+ VS tls: block with sniHosts</text>
  <line x1="705" y1="232" x2="965" y2="232" stroke="#c0392b" stroke-width="1"/>
  <text x="705" y="250" font-size="10.5" fill="#7c1a1a">+ Gateway + VS structure both change</text>
  <text x="705" y="266" font-size="10.5" fill="#7c1a1a">+ Client must use https:// + SNI</text>
  <text x="705" y="282" font-size="10.5" fill="#7c1a1a">- Loses HTTP-layer (path) routing</text>
  <text x="705" y="298" font-size="10.5" fill="#7c1a1a">+ Gateway never decrypts traffic</text>
  <text x="705" y="314" font-size="10.5" fill="#7c1a1a" font-weight="bold">Use when: cert must stay end-to-end</text>

  <!-- Bottom summary -->
  <rect x="20" y="360" width="960" height="140" rx="8" fill="#f6f6f6" stroke="#ccc"/>
  <text x="35" y="384" font-size="13" font-weight="bold" fill="#333">Exam framing:</text>
  <text x="35" y="406" font-size="11.5" fill="#333">All three fixes are technically correct — they solve the same symptom from a different layer of the stack. The ICA exam usually</text>
  <text x="35" y="424" font-size="11.5" fill="#333">rewards recognizing that a DestinationRule change is the smallest, least invasive fix when the Gateway and VirtualService are</text>
  <text x="35" y="442" font-size="11.5" fill="#333">otherwise correct and only the destination traffic policy is missing. Re-architecting the backend (Option A) or converting the</text>
  <text x="35" y="460" font-size="11.5" fill="#333">Gateway to TLS passthrough (Option C) are valid but heavier changes — reach for them only when the constraints call for it</text>
  <text x="35" y="478" font-size="11.5" fill="#333">(e.g., you must preserve end-to-end customer-managed certificates, or you're redesigning the service to be mesh-native).</text>
</svg>
