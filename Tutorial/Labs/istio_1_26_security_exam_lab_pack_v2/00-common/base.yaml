apiVersion: v1
kind: Namespace
metadata:
  name: security-labs
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caller-sa
  namespace: security-labs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-sa
  namespace: security-labs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-sa
  namespace: security-labs
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: security-labs
spec:
  selector:
    app: payment
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: security-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      serviceAccountName: payment-sa
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fraud
  namespace: security-labs
spec:
  selector:
    app: fraud
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
  namespace: security-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud
  template:
    metadata:
      labels:
        app: fraud
    spec:
      serviceAccountName: fraud-sa
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caller
  namespace: security-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caller
  template:
    metadata:
      labels:
        app: caller
    spec:
      serviceAccountName: caller-sa
      containers:
      - name: curl
        image: curlimages/curl:8.10.1
        command: ["sleep","3600"]
