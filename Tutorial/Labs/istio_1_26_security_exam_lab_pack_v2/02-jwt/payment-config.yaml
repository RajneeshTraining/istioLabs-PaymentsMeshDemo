apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-nginx-config
  namespace: security-labs
data:
  default.conf: |
    server {
      listen 80;
      location = /payment { return 200 "payment\n"; }
      location = /payment/admin { return 200 "payment-admin\n"; }
      location / { return 404 "not-found\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: security-labs
spec:
  template:
    spec:
      containers:
      - name: nginx
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config
        configMap:
          name: payment-nginx-config
