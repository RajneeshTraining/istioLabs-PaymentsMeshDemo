# A new version of inventory the team wants to validate against real
# production traffic patterns before trusting it with real users.
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory-v2, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory, version: v2}}
  template:
    metadata: {labels: {app: inventory, version: v2}}
    spec:
      serviceAccountName: inventory
      containers:
      - name: app
        image: hashicorp/http-echo
        args: ["-listen=:8080", "-text=inventory v2 ok"]
        ports: [{name: http, containerPort: 8080}]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: inventory, namespace: shop}
spec:
  host: inventory
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
