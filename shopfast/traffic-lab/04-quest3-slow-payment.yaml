# Simulates a slow payment provider: every request is delayed by 5 seconds.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: payment, namespace: shop}
spec:
  hosts: [payment]
  http:
  - fault:
      delay:
        percentage: {value: 100}
        fixedDelay: 5s
    route:
    - destination: {host: payment}
