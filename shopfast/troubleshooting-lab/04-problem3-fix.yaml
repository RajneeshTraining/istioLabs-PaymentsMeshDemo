# FIXES: subset "v2" now correctly matches "version: v2" pods.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: inventory, namespace: shop}
spec:
  host: inventory
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: inventory, namespace: shop}
spec:
  hosts: [inventory]
  http:
  - route:
    - destination: {host: inventory, subset: v1}
      weight: 50
    - destination: {host: inventory, subset: v2}
      weight: 50
