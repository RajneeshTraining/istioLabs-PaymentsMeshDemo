# BREAKS canary routing: the DestinationRule's "v2" subset selector has a
# typo ("version2" instead of "v2"), so it matches zero pods. The
# VirtualService still sends 50% of traffic to that subset.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: inventory, namespace: shop}
spec:
  host: inventory
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: version2}   # <-- typo, should be "v2"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: inventory, namespace: shop}
spec:
  hosts: [inventory]
  http:
  - route:
    - destination: {host: inventory, subset: v1}
      weight: 50
    - destination: {host: inventory, subset: v2}
      weight: 50
