apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: orders-internal
  namespace: mesh-gateway-labs
spec:
  hosts: [orders.mesh-gateway-labs.svc.cluster.local]
  gateways: [mesh]
  http:
  - route:
    - destination:
        host: backend.mesh-gateway-labs.svc.cluster.local
        subset: v2
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend
  namespace: mesh-gateway-labs
spec:
  host: backend.mesh-gateway-labs.svc.cluster.local
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
