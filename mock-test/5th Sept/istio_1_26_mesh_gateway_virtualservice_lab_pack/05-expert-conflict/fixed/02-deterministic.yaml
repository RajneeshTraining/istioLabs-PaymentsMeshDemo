apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: orders
  namespace: mesh-gateway-labs
spec:
  hosts:
  - orders.mesh-gateway-labs.svc.cluster.local
  - orders.example.test
  gateways:
  - mesh
  - edge-gateway
  http:
  - match:
    - gateways: ["mesh"]
      uri:
        prefix: /orders/v2
    route:
    - destination:
        host: backend.mesh-gateway-labs.svc.cluster.local
        subset: v2
  - match:
    - gateways: ["mesh"]
    - gateways: ["edge-gateway"]
    route:
    - destination:
        host: backend.mesh-gateway-labs.svc.cluster.local
        subset: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend
  namespace: mesh-gateway-labs
spec:
  host: backend.mesh-gateway-labs.svc.cluster.local
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
